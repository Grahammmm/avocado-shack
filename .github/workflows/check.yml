name: check

# Offline checks only: no secrets, no deploy, no network beyond installing the
# pinned Playwright test tool. All servers bind 127.0.0.1 with a temporary
# community database; the private runtime data directory is never used.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: "1.64.1"

jobs:
  check:
    name: check
    # Self-hosted on AgentOrange (operator 2026-11-02). avocado-shack is PRIVATE, so this repo
    # receives no fork pull requests and needs no same-repo guard; GitHub-hosted minutes are
    # billable for private repos and were blocked by the account spend limit, which stopped every
    # check job at 0 steps. Runners agentorange-avo-1/2 carry the avocado-shack label.
    runs-on: [self-hosted, Linux, X64, avocado-shack]
    # hass/tests took ~6.5 min on GitHub-hosted runners and >9.5 min on the shared
    # AgentOrange host (run 41518439444 was cancelled at 10 min with every test passing).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Playwright is a test-only tool (not a repo dependency); cache the npm
      # install and the downloaded Chromium, keyed by the pinned version.
      - name: Cache Playwright package and browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/pw-tools
            ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      # The AgentOrange runners are unprivileged user services (no sudo), so
      # `--with-deps` / `install-deps` (which apt-get through sudo) only run on
      # GitHub-hosted runners. The self-hosted host already has Chromium's
      # system libraries installed (same pattern as skippercast's ci.yml);
      # the verify step below fails loudly if one is ever missing.
      - name: Install Playwright test tool
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/pw-tools
          npm install --prefix ~/pw-tools --no-save --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          ~/pw-tools/node_modules/.bin/playwright install chromium

      - name: Install Chromium system libraries (GitHub-hosted only)
        if: runner.environment == 'github-hosted'
        run: ~/pw-tools/node_modules/.bin/playwright install-deps chromium

      - name: Verify Chromium launches (system libraries present)
        run: |
          cd ~/pw-tools
          node -e "require('playwright').chromium.launch().then(b => b.close())"

      - name: Python syntax check
        run: python3 -m compileall -q storefront-mockup reports/hermes-handoff

      - name: Commerce gateway unit tests (pure logic, no dependencies)
        # owner-photo needs the sharp image library; the commerce prototype is
        # historical, so only dependency-free tests run here.
        run: |
          tests=$(ls commerce/gateway/*.test.mjs | grep -v '/owner-photo\.test\.mjs$')
          node --test $tests

      # community-ui-qa.cjs also reads the normal site at PREVIEW_URL (read-only;
      # it asserts the sample RSVP makes no POST), so one temp-DB server backs
      # both the catalog check and that part of the community check.
      # The self-hosted host may already run a long-lived preview on 3101 (and
      # other jobs share it), so use the first port nothing answers on, and
      # stop if our own server is not the one that came up.
      - name: Catalog + community checks (loopback servers, temporary databases)
        run: |
          export PLAYWRIGHT_MODULE="$HOME/pw-tools/node_modules/playwright"
          export QA_OUT_DIR="$RUNNER_TEMP/qa"
          port=
          for p in $(seq 3111 3199); do
            curl -s -o /dev/null --max-time 1 "http://127.0.0.1:$p/" || { port=$p; break; }
          done
          test -n "$port"
          export PREVIEW_URL="http://127.0.0.1:$port"
          mkdir -p "$QA_OUT_DIR"
          AVOSHACK_COMMUNITY_DB="$RUNNER_TEMP/site.sqlite3" \
            python3 storefront-mockup/community-server.py --port "$port" >"$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            curl -fsS "$PREVIEW_URL/" >/dev/null 2>&1 && break
            sleep 0.2
          done
          kill -0 "$server_pid" || { cat "$RUNNER_TEMP/server.log"; exit 1; }
          node storefront-mockup/catalog-only-qa.cjs
          python3 storefront-mockup/community-qa.py
          # AVO-LAUNCH-1: the publishable build (allowlist only) on a plain static host, every page checked.
          site="$(mktemp -d "$RUNNER_TEMP/published-site.XXXXXX")"
          python3 hass/sitegen.py --publish "$site"
          node storefront-mockup/static-site-qa.cjs "$site"

      - name: Hass tests (placeholder until hass/tests exists)
        run: |
          export PLAYWRIGHT_MODULE="$HOME/pw-tools/node_modules/playwright"
          if [ -d hass/tests ]; then
            python3 -m unittest discover -s hass/tests -t . -v
          else
            echo "hass/tests not present yet; nothing to run."
          fi
